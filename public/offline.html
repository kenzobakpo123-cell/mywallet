<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d4e" />
    <title>Finwise — Sedang offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f5ef;
        color: #20231f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, 100%);
        padding: 28px;
        border: 1px solid #e3e0d7;
        border-radius: 16px;
        background: #fffefa;
        box-shadow: 0 14px 32px rgba(38, 52, 43, .06);
        text-align: center;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 12px 12px 12px 4px;
        background: #2f5d4e;
        color: #fff;
        font-weight: 800;
        font-size: 18px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; color: #5d655d; font-size: 14px; line-height: 1.6; }
      button {
        min-height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #2f5d4e;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">F</div>
      <h1>Sedang offline</h1>
      <p>Tampilan Finwise tersedia, tetapi data keuangan perlu koneksi internet. Sambungkan jaringan lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
